<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Adrian Antosiak - independent consultant. AI for business, custom applications, websites and IT support. Based in Poland, remote worldwide." />
  <meta name="theme-color" content="#f3f1ec" />
  <title>Adrian Antosiak - AI, Apps, Web, IT</title>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --ease: cubic-bezier(.4, 0, .2, 1);
      --bg: #f3f1ec;
      --fg: #0b0b0b;
      --mute: #6b6b66;
      --rule: #0b0b0b;
      --accent: #0b0b0b;
      --chrome: #0b0b0b;
      --chrome-fg: #f3f1ec;
    }
    *, *::before, *::after { box-sizing: border-box; }
    *, *::before, *::after {
      transition:
        background-color 600ms var(--ease),
        color 600ms var(--ease),
        border-color 600ms var(--ease),
        outline-color 600ms var(--ease),
        fill 600ms var(--ease),
        stroke 600ms var(--ease),
        box-shadow 600ms var(--ease);
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition: none !important; }
    }
    html, body { margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    html, body { overflow-x: clip; }
    body {
      background: var(--bg);
      color: var(--fg);
      font-family: 'Inter Tight', system-ui, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      min-height: 100vh;
    }
    button { background: none; border: none; padding: 0; cursor: pointer; font: inherit; color: inherit; }
    a { color: inherit; text-decoration: none; }
    ul, ol { list-style: none; margin: 0; padding: 0; }
    h1, h2, h3, h4, h5, h6, p { margin: 0; }
    img, svg { display: block; max-width: 100%; }
    ::selection { background: var(--accent); color: var(--chrome-fg); }
  </style>

  <script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.24.7/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel" data-presets="react" src="src/i18n.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/worlds.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/divider.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/sections/ai.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/sections/app.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/sections/web.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/sections/it.jsx"></script>
  <script type="text/babel" data-presets="react" src="src/app.jsx"></script>
</body>
</html>
